      2.0, mis à jour toutes les heures. Il rend ADR-0013 applicable tel quel.
      Aucune raison de l'approuver aujourd'hui : rien ne le consomme.

# --- Ce que le passage en APPROVED exige -------------------------------------
# Liste de contrôle, à remplir par le fondateur, source par source.
# Procédure détaillée, point par point : docs/RUNBOOK_APPROBATION_SOURCE.md
approval_checklist:
  - Licence lue à la source primaire, pas dans une note du kit.
  - Réutilisation commerciale explicitement autorisée, ou condition documentée.
  - Obligations d'attribution et de partage à l'identique consignées.
  - Conditions d'API, quotas et fréquence de mise à jour lus.
  - Absence de données personnelles, ou restrictions consignées.
  - Stratégie de cache définie (OPEN-07) — le budget cible est de 0 € récurrent.
  - Date de vérification renseignée dans `last_checked_at`.
