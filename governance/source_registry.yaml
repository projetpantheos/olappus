# =============================================================================
# OLAPPUS — SOURCE REGISTRY
#
# Reprise des 26 champs et des 5 statuts de `docs/00_PREVIOUS_BLUEPRINT` §5,
# promus dans la couche normative (docs/DEPRECATION_MAP : « À PROMOUVOIR »).
#
# RÈGLE ABSOLUE (`docs/11`) : aucune source n'est ingérée parce qu'elle est
# « publique » ou « open ». Elle doit être enregistrée ici et franchir le
# License Gate. **Default deny** : tout ce qui n'est pas APPROVED est refusé.
#
# RÈGLE DE VÉRIFICATION (D14) : les licences et quotas cités dans `docs/` sont
# NON VÉRIFIÉS. Aucune valeur de licence ci-dessous ne fait foi tant que
# `license_verified` n'est pas `true` avec une date de vérification.
# =============================================================================

version: 1
updated_at: '2026-09-08'
gate: G5

# --- Statuts autorisés -------------------------------------------------------
statuses:
  APPROVED: Ingestion autorisée. Licence vérifiée à la source primaire.
  APPROVED_WITH_CONDITIONS: Ingestion autorisée sous réserve documentée (attribution, périmètre).
  REVIEW_REQUIRED: Enregistrée, non ingérable. Licence ou conditions non vérifiées.
  REJECTED: Ingestion interdite. Motif consigné.
  DEPRECATED: Anciennement utilisée, plus ingérée.

# Seuls ces deux statuts ouvrent l'ingestion. Le License Gate ne connaît pas
# d'autre porte.
ingestible_statuses:
  - APPROVED
  - APPROVED_WITH_CONDITIONS

sources:
  - source_id: legifrance
    name: Légifrance
    publisher: Direction de l'information légale et administrative
    country: FR
    jurisdiction: FR
    dataset_url: https://www.data.gouv.fr/datasets/legi-codes-lois-et-reglements-consolides/
    api_url: https://piste.gouv.fr/

    # --- Licence : LUE, PAS ENCORE ENGAGÉE -----------------------------------
    # Relevé le 2026-09-09 sur la page « Open data et API » de Légifrance
    # elle-même, qui énonce trois documents et non un :
    #   1. licence ouverte 2.0
    #   2. CGU du portail PISTE
    #   3. CGU de l'API Légifrance
    #   + des quotas « détaillés sur le portail PISTE », donc après inscription.
    #
    # `license_verified` reste false : les deux CGU ne sont pas lues et les
    # quotas sont inconnus. Ce champ porte l'engagement du fondateur, pas le
    # travail de relevé.
    license_name: Licence Ouverte / Open Licence version 2.0
    license_url: https://www.etalab.gouv.fr/wp-content/uploads/2017/04/ETALAB-Licence-Ouverte-v2.0.pdf
    license_verified: false
    commercial_use_allowed: true
    redistribution_allowed: true
    attribution_required: true
    share_alike_required: false
    privacy_restrictions: >-
      La Licence Ouverte 2.0 prévoit que l'information puisse contenir des
      données à caractère personnel, réutilisables dans le respect du cadre
      légal. La jurisprudence publiée peut nommer des personnes : à traiter
      sous docs/13, indépendamment de la licence.

    update_frequency: daily
    last_checked_at: null
    last_imported_at: null
    source_hash: null
    schema_version: null
    quality_score: null
    priority: S
    legal_review_status: PENDING

    status: REVIEW_REQUIRED

    purpose: >-
      Servir les trois droits du périmètre P0 (ADR-0007) : garantie légale de
      conformité, droit de rétractation, résiliation et réclamation. Sans source
      juridique datée, Thémis ne peut produire aucune affirmation.

    blocking_conditions:
      - "CGU du portail PISTE non lues : PDF scanné, sans couche texte. Elles s'acceptent à l'inscription, donc à lire à ce moment-là."
      - 'Quotas inconnus : consultables seulement sur PISTE, onglet Applications, après inscription.'
      - 'Stratégie de cache non décidée (OPEN-07), or elle dépend des quotas.'
      - 'Approbation non signée par le fondateur.'

    documents:
      cgu_api_legifrance:
        url: https://www.legifrance.gouv.fr/contenu/Media/files/pied-de-page/cgu-legifrance-api-vf-15-12-2022_0.pdf
        version: V1.0 du 15/12/2022
        lu_le: '2026-09-09'
      cgu_piste:
        url: https://piste.gouv.fr/images/com_apiportal/CGU/cgu_portal_FR.pdf
        lu_le: null
        note: PDF image, non extractible automatiquement.
      gratuite:
        url: https://www.legifrance.gouv.fr/loda/texte_lc/JORFTEXT000029135221/2019-11-27/
        note: Arrêté du 24 juin 2014 sur la gratuité de la réutilisation des bases juridiques de la DILA.

    # --- Ce que les CGU de l'API imposent réellement -------------------------
    # Relevé le 2026-09-09 dans le texte intégral. En cas de contradiction entre
    # la licence, les CGU PISTE et celles-ci, ce sont **celles-ci qui
    # prévalent** (article I.1). Ce n'est donc pas un document secondaire.
    api_terms:
      usage_commercial: >-
        Autorisé (art. VI.2), mais « au risque et péril de l'Utilisateur ».
      donnees_non_opposables: >-
        Art. VI.1 - seuls les PDF signés publiés au JORF sont opposables ; les
        données de l'API ne le sont pas. CONSÉQUENCE PRODUIT - Olappus ne peut
        jamais présenter une règle issue de cette API comme du droit opposable.
        Confirme docs/10 et ADR-0003 par une source primaire, au lieu d'un
        principe éditorial.
      aucune_garantie: >-
        Art. VI.1 - ni le contenu, ni la complétude, ni la fraîcheur ne sont
        garantis. Une règle affichée doit donc porter sa date et son incertitude.
      disponibilite: >-
        Art. IV.1 - aucun niveau minimal garanti, cible de 95 % par jour,
        indisponibilité possible sans information préalable. Le cache et le
        silence gracieux ne sont pas des optimisations, ce sont des exigences.
      quotas: >-
        Art. IV.3 - quotas par seconde, minute ou jour, en nombre de requêtes ou
        en bande passante, par application ou par méthode. Consultables sur
        PISTE après inscription. Modifiables à tout moment par la DILA.
      secrets: >-
        Art. III.3 et V.3 - les clés OAuth sont strictement réservées à
        l'application et ne doivent jamais être publiées. Toute compromission
        doit être notifiée à la DILA et à l'AIFE. Obligation opérationnelle à
        porter par SEC-34 et le scan de secrets.
      suspension: >-
        Art. VII.1 - suspension possible sans préavis en cas de manquement. Le
        registre doit pouvoir passer à REJECTED sans toucher au code métier ;
        c'est déjà le cas par construction.
      acceptation: >-
        Art. I.2 - acceptation en deux temps, à l'inscription PISTE puis au
        choix de l'API. Utilisateur majeur numérique, 15 ans minimum.

    notes: >-
      Relevé du 2026-09-09 : licence et CGU de l'API lues intégralement à la
      source. Ce qui reste tient aux quotas et au cache, pas au droit de
      réutilisation. Divergence constatée et non tranchée : la fiche data.gouv.fr du
      jeu LEGI déclare la Licence Ouverte 1.0 (identifiant « fr-lo »), tandis
      que Légifrance déclare la 2.0 pour l'API. Les deux autorisent l'usage
      commercial et n'imposent pas de partage à l'identique ; la version exacte
      doit néanmoins être arrêtée avant toute attribution affichée.
      Le passage en APPROVED reste une action fondateur.

