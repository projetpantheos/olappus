    last_imported_at: null
    source_hash: null
    schema_version: null
    quality_score: null
    priority: A
    legal_review_status: PENDING

    status: REVIEW_REQUIRED

    purpose: >-
      Rappels de produits. Hors P0 (aucun module ne les porte, ADR-0003), mais
      enregistrée pour que la correspondance sur GTIN exact d'ADR-0013 ait une
      source identifiée le jour venu.

    blocking_conditions:
      - Licence non vérifiée à la source primaire.
      - Hors périmètre P0: aucun module ne consomme cette source aujourd'hui.

    notes: >-
      ADR-0013 impose une correspondance sur GTIN exact uniquement. Un faux
      positif provoque une panique inutile, un faux négatif un risque physique.

# --- Ce que le passage en APPROVED exige -------------------------------------
# Liste de contrôle, à remplir par le fondateur, source par source.
approval_checklist:
  - Licence lue à la source primaire, pas dans une note du kit.
  - Réutilisation commerciale explicitement autorisée, ou condition documentée.
  - Obligations d'attribution et de partage à l'identique consignées.
  - Conditions d'API, quotas et fréquence de mise à jour lus.
  - Absence de données personnelles, ou restrictions consignées.
  - Stratégie de cache définie (OPEN-07) — le budget cible est de 0 € récurrent.
  - Date de vérification renseignée dans `last_checked_at`.
