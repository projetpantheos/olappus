    owner: Connector
    access: service_only
    status: SPECIFIED
    source_doc: DAT-05
    note: >-
      Zone de quarantaine. Rien ne sort d'ici sans passer par extraction, normalisation et minimisation. Aucune exposition au client.
    fields:
      - name: source_id
        classification: L1
        purpose: Identifiant de la charge brute reçue.
        source: connector
        normalized_form: opaque_id
        retention: connection_lifetime
        export: true
        delete: cascade
        ai_policy: AI_FORBIDDEN
        provenance: true
        rls_scope: service_only
      - name: payload_raw
        classification: L0_RAW_QUARANTINE
        purpose: Charge brute non normalisée. Jamais durable par défaut.
        source: connector
        normalized_form: none
        retention: days_7
        export: true
        delete: cascade
        ai_policy: AI_FORBIDDEN
        provenance: true
        rls_scope: service_only
      - name: content_hash
        classification: L2
        purpose: Empreinte permettant la déduplication sans conserver le contenu.
        source: system
        normalized_form: sha256
        retention: connection_lifetime
        export: false
        delete: cascade
        ai_policy: AI_FORBIDDEN
        provenance: true
        rls_scope: service_only
      - name: observed_at
        classification: L2
        purpose: Date d'observation par le connecteur.
        source: connector
        normalized_form: timestamp_utc
        retention: connection_lifetime
        export: true
        delete: cascade
        ai_policy: AI_FORBIDDEN
        provenance: true
        rls_scope: service_only
      - name: user_id
        classification: L1
        purpose: Proprietaire, pour la suppression en cascade.
        source: system
        normalized_form: opaque_id
        retention: connection_lifetime
        export: true
        delete: cascade
        ai_policy: AI_FORBIDDEN
        provenance: false
        rls_scope: service_only
      - name: connector_id
        classification: L2
        purpose: Connecteur a l origine de la charge.
        source: system
        normalized_form: enum
        retention: connection_lifetime
        export: true
        delete: cascade
        ai_policy: AI_FORBIDDEN
        provenance: false
        rls_scope: service_only
      - name: purged_at
        classification: L2
        purpose: Date de purge de payload_raw. La ligne subsiste sans son contenu.
        source: system
        normalized_form: timestamp_utc
        retention: connection_lifetime
        export: true
        delete: cascade
        ai_policy: AI_FORBIDDEN
        provenance: true
        rls_scope: service_only

  - id: extraction.record
    schema: extraction
