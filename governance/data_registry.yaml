  # --- audit -----------------------------------------------------------------
  - id: audit.action_log
    schema: audit
    owner: Core
    access: append_only_audit
    status: SPECIFIED
    source_doc: DAT-08
    note: >-
      Journal des actions externes. Aucune valeur interdite par SEC-34 ne doit y figurer : ni jeton, ni corps brut, ni adresse.
    fields:
      - name: actor_id
        classification: L1
        purpose: Acteur de l'action, présent nativement dans l'enveloppe (ADR-0006).
        source: system
        normalized_form: opaque_id
        retention: months_24
        export: true
        delete: anonymize
        ai_policy: AI_FORBIDDEN
        provenance: true
        rls_scope: self
      - name: action_id
        classification: L1
        purpose: Action journalisée.
        source: system
        normalized_form: opaque_id
