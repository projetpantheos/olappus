        source: system
        normalized_form: sha256
        retention: case_lifetime
        export: true
        delete: cascade
        ai_policy: AI_FORBIDDEN
        provenance: true
        rls_scope: self
      - name: captured_at
        classification: L2
        purpose: Date de capture de la preuve.
        source: system
        normalized_form: timestamp_utc
        retention: case_lifetime
        export: true
        delete: cascade
