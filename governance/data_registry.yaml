        export: true
        delete: cascade
        ai_policy: AI_ALLOWED
        provenance: true
        rls_scope: self

  - id: core.evidence
    schema: core
    owner: Core
    access: owner_only
    status: SPECIFIED
    source_doc: DAT-05
    fields:
      - name: evidence_id
        classification: L1
        purpose: Identifiant de la preuve.
        source: system
        normalized_form: opaque_id
        retention: case_lifetime
        export: true
        delete: cascade
        ai_policy: AI_FORBIDDEN
        provenance: false
        rls_scope: self
      - name: source_id
        classification: L1
