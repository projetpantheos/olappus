        source: system
        normalized_form: opaque_id
        retention: case_lifetime
        export: true
        delete: cascade
        ai_policy: AI_FORBIDDEN
        provenance: false
        rls_scope: self
      - name: module_id
        classification: L2
        purpose: >-
          Module ayant produit le dossier. Métadonnée métier, et non identifiant d'utilisateur : d'où L2 et non L1, qui interdirait toute exposition IA.
        source: system
        normalized_form: enum
        retention: case_lifetime
        export: true
        delete: cascade
        ai_policy: AI_ALLOWED
        provenance: false
        rls_scope: self
      - name: type
        classification: L2
        purpose: Nature de la situation.
        source: derived
        normalized_form: enum
        retention: case_lifetime
        export: true
        delete: cascade
        ai_policy: AI_ALLOWED
        provenance: true
        rls_scope: self
      - name: status
        classification: L2
        purpose: État dans la machine à états du Case.
        source: system
        normalized_form: enum
        retention: case_lifetime
        export: true
        delete: cascade
        ai_policy: AI_ALLOWED
        provenance: false
        rls_scope: self
      - name: priority
        classification: L2
        purpose: Priorité calculée (impact, urgence, confiance, réversibilité, effort).
        source: derived
        normalized_form: integer
        retention: case_lifetime
        export: true
        delete: cascade
        ai_policy: AI_ALLOWED
        provenance: true
        rls_scope: self
      - name: confidence
        classification: L2
        purpose: Niveau de confiance affiché à l'utilisateur.
        source: derived
        normalized_form: confidence_enum
        retention: case_lifetime
        export: true
        delete: cascade
        ai_policy: AI_ALLOWED
        provenance: true
        rls_scope: self

  - id: core.detection
    schema: core
    owner: Core
    access: owner_only
    status: SPECIFIED
    source_doc: PRD-12
    fields:
      - name: detection_id
        classification: L1
        purpose: Identifiant de la détection.
        source: system
        normalized_form: opaque_id
        retention: case_lifetime
        export: true
        delete: cascade
        ai_policy: AI_FORBIDDEN
        provenance: false
        rls_scope: self
      - name: rule_id
        classification: PUBLIC
        purpose: Règle déterministe ayant déclenché la détection.
        source: knowledge
        normalized_form: opaque_id
        retention: case_lifetime
        export: true
        delete: keep
        ai_policy: AI_ALLOWED
        provenance: true
        rls_scope: self
      - name: rule_version
        classification: PUBLIC
        purpose: Version exacte de la règle appliquée. Sans elle, aucune explication n'est reproductible.
        source: knowledge
        normalized_form: semver
        retention: versioned
        export: true
        delete: keep
        ai_policy: AI_ALLOWED
        provenance: true
        rls_scope: self
      - name: confidence
        classification: L2
        purpose: Confiance de la détection.
        source: derived
        normalized_form: confidence_enum
        retention: case_lifetime
        export: true
        delete: cascade
        ai_policy: AI_ALLOWED
        provenance: true
        rls_scope: self

  - id: core.action
    schema: core
    owner: Core
    access: owner_only
    status: SPECIFIED
    source_doc: PRD-12
    fields:
      - name: action_id
        classification: L1
        purpose: Identifiant de l'action.
        source: system
        normalized_form: opaque_id
        retention: case_lifetime
        export: true
        delete: cascade
        ai_policy: AI_FORBIDDEN
        provenance: false
        rls_scope: self
      - name: risk_level
        classification: L2
        purpose: Niveau de risque de l'action (0 à 5, docs/10).
        source: derived
        normalized_form: enum
        retention: case_lifetime
        export: true
        delete: cascade
        ai_policy: AI_ALLOWED
        provenance: true
        rls_scope: self
      - name: permission_level
        classification: L2
        purpose: Niveau de permission requis (READ → EXECUTE_WITH_CONFIRMATION).
        source: system
        normalized_form: enum
        retention: case_lifetime
        export: true
        delete: cascade
        ai_policy: AI_FORBIDDEN
        provenance: false
        rls_scope: self
      - name: prepared_payload
        classification: L3
        purpose: >-
          Contenu exact de l'action préparée, y compris le destinataire. Aucune de ces valeurs ne peut provenir de contenu non fiable (invariant untrusted_content_cannot_parameterize_external_actions).
        source: derived
        normalized_form: structured_json
        retention: case_lifetime
        export: true
        delete: cascade
        ai_policy: AI_FORBIDDEN
        provenance: true
        rls_scope: self

  - id: core.outcome
    schema: core
    owner: Core
    access: owner_only
    status: SPECIFIED
