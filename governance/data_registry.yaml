  # --- knowledge -------------------------------------------------------------
  - id: knowledge.legal_rule
    schema: knowledge
    owner: Knowledge
    access: public_knowledge
    status: SPECIFIED
    source_doc: ADR-0003
    note: >-
      Connaissance collective, sans donnée personnelle. Une règle expirée, hors juridiction ou sous le seuil de confiance ne produit jamais d'affirmation : la sortie est INSUFFICIENT_DATA.
    fields:
      - name: rule_id
        classification: PUBLIC
        purpose: Identifiant de la règle juridique.
        source: knowledge
        normalized_form: opaque_id
        retention: versioned
        export: true
        delete: keep
        ai_policy: AI_ALLOWED
        provenance: true
        rls_scope: public
      - name: jurisdiction
        classification: PUBLIC
        purpose: Juridiction d'application. France uniquement en P0 (ADR-0007).
        source: knowledge
        normalized_form: iso_country
        retention: versioned
        export: true
        delete: keep
        ai_policy: AI_ALLOWED
        provenance: true
        rls_scope: public
      - name: instrument_ref
        classification: PUBLIC
        purpose: Texte de référence identifié.
        source: official_source
        normalized_form: normalized_string
        retention: versioned
