        source: official_source
        normalized_form: local_date
        retention: versioned
        export: true
        delete: keep
        ai_policy: AI_ALLOWED
        provenance: true
        rls_scope: public
      - name: in_force_to
        classification: PUBLIC
        purpose: Fin de validité. Une règle expirée ne produit aucune affirmation.
        source: official_source
        normalized_form: local_date
        retention: versioned
