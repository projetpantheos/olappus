        export: true
        delete: anonymize
        ai_policy: AI_FORBIDDEN
        provenance: true
        rls_scope: self
      - name: occurred_at
        classification: L2
        purpose: Horodatage de l'action.
        source: system
        normalized_form: timestamp_utc
        retention: months_24
        export: true
        delete: keep
        ai_policy: AI_FORBIDDEN
