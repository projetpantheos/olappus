# =============================================================================
# OLAPPUS — DATA REGISTRY
#
# Source déclarative de gouvernance des champs métier (DAT-06).
# « Data Governance as Code » : ce fichier doit alimenter, autant que possible,
# les politiques d'accès, les tests RLS, la rétention, l'export, la suppression
# et les contrôles du AI Gateway. Il n'est pas une documentation : il est
# validé automatiquement (tooling/validate-data-registry.mjs) et la CI échoue
# s'il est incohérent.
#
# Règle de non-invention (00_PRE_CLAUDE_FREEZE) : une entité dont le kit ne
# spécifie pas les champs est déclarée FIELDS_UNSPECIFIED avec la gate où elle
# sera définie. Aucun champ n'est inventé ici.
#
# Autorité : ADR-0005 (schémas), ADR-0012 (email), D8 (L0_RAW_QUARANTINE).
# =============================================================================

version: 1
updated_at: '2026-09-08'
gate: G2

# --- Vocabulaire de classification -------------------------------------------
classifications:
  L0_RAW_QUARANTINE:
    label: Données brutes en quarantaine
    ai_policy_max: AI_FORBIDDEN
    durable_by_default: false
  L1:
    label: Préférences et identifiants techniques
    ai_policy_max: AI_FORBIDDEN
    durable_by_default: true
  L2:
    label: Données métier normalisées
    ai_policy_max: AI_ALLOWED
    durable_by_default: true
  L3:
    label: Données identifiantes ou sensibles
    ai_policy_max: AI_MINIMIZED_ONLY
    durable_by_default: true
  L4:
    label: Secrets et données financières directes
    ai_policy_max: AI_FORBIDDEN
    durable_by_default: true
  PUBLIC:
    label: Connaissance collective sans donnée personnelle
    ai_policy_max: AI_ALLOWED
    durable_by_default: true

ai_policies:
  - AI_FORBIDDEN
  - AI_MINIMIZED_ONLY
  - AI_LOCAL_ONLY
  - AI_ALLOWED

# --- Modes d'accès : traduits en politiques RLS ------------------------------
access_patterns:
  owner_only:
    description: Lecture et écriture par le propriétaire uniquement.
    rls: 'user_id = auth.uid()'
  service_only:
    description: Aucune exposition au client. Accès service serveur uniquement.
    rls: 'deny all to authenticated, anon'
  public_knowledge:
    description: Lecture par tout compte authentifié ; écriture par la gouvernance Muses.
    rls: 'select: authenticated ; insert/update: service'
  append_only_audit:
    description: Écriture par le service, lecture restreinte, jamais de mise à jour.
    rls: 'no update, no delete'

# --- Vocabulaire de rétention ------------------------------------------------
# Toute valeur OPEN doit être chiffrée avant la sortie de G2 : « court » n'est
# pas testable.
retention_vocabulary:
  account_lifetime: Conservé tant que le compte existe.
  until_revoked: Conservé jusqu'à révocation explicite.
  case_lifetime: Conservé tant que le Case n'est pas résolu ou expiré.
  connection_lifetime: Conservé tant que la connexion au fournisseur existe.
  versioned: Conservé sous forme versionnée, jamais écrasé.
  not_retained: Jamais conservé durablement.
  OPEN: Durée non encore décidée — bloquant pour la sortie de G2.
  days_7: "7 jours. Charge brute de quarantaine : delai de rejeu d'une extraction corrigee."
  months_24: '24 mois. Audit des actions externes : horizon de la garantie legale de conformite.'

# =============================================================================
# ENTITÉS
# =============================================================================
entities:
  # --- identity --------------------------------------------------------------
  - id: identity.account
    schema: identity
    owner: Identity
    access: owner_only
    status: SPECIFIED
    source_doc: DAT-08
    fields:
      - name: account_id
        classification: L1
        purpose: Identifiant opaque du compte.
        source: system
        normalized_form: opaque_id
        retention: account_lifetime
        export: true
        delete: cascade
        ai_policy: AI_FORBIDDEN
        provenance: false
        rls_scope: self
      - name: status
        classification: L1
        purpose: État du compte (actif, suspendu, clos).
        source: system
        normalized_form: enum
        retention: account_lifetime
        export: true
        delete: cascade
        ai_policy: AI_FORBIDDEN
        provenance: false
        rls_scope: self
      - name: authentication_metadata
        classification: L4
        purpose: Métadonnées d'authentification (passkey). Aucune donnée métier.
        source: system
        normalized_form: opaque_blob
        retention: account_lifetime
        export: false
        delete: cascade
        ai_policy: AI_FORBIDDEN
        provenance: false
        rls_scope: service_only
      - name: recovery_metadata
        classification: L4
        purpose: Métadonnées de récupération. La perte des codes est irréversible (ADR-0008).
        source: system
        normalized_form: opaque_blob
        retention: account_lifetime
        export: false
        delete: cascade
        ai_policy: AI_FORBIDDEN
        provenance: false
        rls_scope: service_only

  - id: identity.device
    schema: identity
    owner: Identity
    access: owner_only
    status: SPECIFIED
    source_doc: DAT-08
    fields:
      - name: device_id
        classification: L1
        purpose: Identité propre de l'appareil, révocable et auditable.
        source: system
        normalized_form: opaque_id
        retention: until_revoked
        export: true
        delete: cascade
        ai_policy: AI_FORBIDDEN
        provenance: false
        rls_scope: self
      - name: account_id
        classification: L1
        purpose: Rattachement au compte.
        source: system
        normalized_form: opaque_id
        retention: until_revoked
        export: true
        delete: cascade
        ai_policy: AI_FORBIDDEN
        provenance: false
        rls_scope: self
      - name: public_key_reference
        classification: L4
        purpose: Référence de clé publique de l'appareil.
        source: system
        normalized_form: opaque_blob
        retention: until_revoked
        export: false
        delete: cascade
        ai_policy: AI_FORBIDDEN
        provenance: false
        rls_scope: service_only
      - name: status
        classification: L1
        purpose: État de l'appareil (actif, révoqué).
        source: system
        normalized_form: enum
        retention: account_lifetime
        export: true
        delete: cascade
        ai_policy: AI_FORBIDDEN
        provenance: false
        rls_scope: self
      - name: revoked_at
        classification: L1
        purpose: Date de révocation. Conservée pour l'audit après révocation.
        source: system
        normalized_form: timestamp_utc
        retention: account_lifetime
        export: true
        delete: cascade
        ai_policy: AI_FORBIDDEN
        provenance: false
        rls_scope: self

